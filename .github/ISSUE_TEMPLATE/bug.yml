name: 缺陷报告 / Bug
description: 报告 UI、采集或状态问题；请先脱敏。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 不要上传真实订阅链接、口令、Cookie、节点凭证或完整 KV。安全问题先阅读 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 项目版本 / commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 部署方式、系统、浏览器与来源类型
      placeholder: Worker 编辑器或 Wrangler；手机/桌面；pull/file/push。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏诊断与截图
      description: 包括状态、HTTP code、quotaUpdatedAt 或 probeState；人工检查敏感信息。
